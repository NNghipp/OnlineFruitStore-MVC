<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Email Template - MyStore</title>
</head>

<body style="font-family: 'Arial', sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <table width="600" cellpadding="0" cellspacing="0"
        style="margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
        <!-- Header -->
        <tr>
            <td style="background-color: #0d6efd; color: white; padding: 20px; text-align: center;">
                <h1 style="margin: 0;">MyStore</h1>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding: 30px;">
                <h2 style="color: #333;">Xin chào [Tên khách hàng]!</h2>
                <p style="color: #666; line-height: 1.6;">
                    Cảm ơn bạn đã đặt hàng tại MyStore. Đơn hàng của bạn đã được xác nhận.
                </p>

                <table width="100%" style="margin: 20px 0; border-collapse: collapse;">
                    <tr style="background-color: #f8f9fa;">
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Sản phẩm</th>
                        <th style="padding: 10px; text-align: right; border: 1px solid #ddd;">Giá</th>
                    </tr>
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">[Tên sản phẩm]</td>
                        <td style="padding: 10px; text-align: right; border: 1px solid #ddd;">[Giá]</td>
                    </tr>
                </table>

                <a href="#"
                    style="display: inline-block; background-color: #0d6efd; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">
                    Xem đơn hàng
                </a>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="background-color: #f8f9fa; padding: 20px; text-align: center; color: #666; font-size: 14px;">
                <p style="margin: 0;">© 2025 MyStore. All rights reserved.</p>
                <p style="margin: 5px 0 0;">Địa chỉ: 123 Đường ABC, Quận XYZ, TP. Hồ Chí Minh</p>
            </td>
        </tr>
    </table>
</body>

</html>
